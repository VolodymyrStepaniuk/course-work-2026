services:

  # PostgreSQL
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"          # expose for external tools (DBeaver, psql, etc.)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker          # separate env file with docker-internal URLs
    ports:
      - "8000:8000"                # expose for direct API access / Swagger UI
    depends_on:
      db:
        condition: service_healthy

  # React frontend (nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"                  # app available at http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data:
